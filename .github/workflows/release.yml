name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  # Android APK + AAB
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # Windows
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath port_scan-windows-x64.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: port_scan-windows-x64.zip

  # Linux
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package Linux
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../port_scan-linux-x64.tar.gz bundle

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: port_scan-linux-x64.tar.gz

  # macOS
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - run: flutter create --platforms=macos .

      - run: flutter pub get

      # macOS
      - run: flutter build macos --release

      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../port_scan-macos.zip port_scan.app

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: port_scan-macos.zip

      # 创建 Release 并上传所有产物
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-macos
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/android-aab/app-release.aab
            artifacts/windows-x64/port_scan-windows-x64.zip
            artifacts/linux-x64/port_scan-linux-x64.tar.gz
            artifacts/macos/port_scan-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}